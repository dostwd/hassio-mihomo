# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Mihomo Proxy
version: "1.2.4.f"
slug: dostwd_mihomo
description: Mihomo (Clash.Meta) - A rule-based transparent proxy with advanced routing capabilities
url: "https://github.com/dostwd/hassio-mihomo/tree/main/mihomo"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
host_network: true
rating: 4
ports:
  7890/tcp: 7890
  7891/tcp: 7891
  7893/tcp: 7893
  9898/tcp: 9898
  9093/tcp: 9093
  153/udp: 153
ports_description:
  7890/tcp: "HTTP Proxy"
  7891/tcp: "SOCKS5 Proxy"
  7893/tcp: "Mixed Proxy"
  9898/tcp: "TProxy"
  9093/tcp: "API/Dashboard"
  153/udp: "DNS Server"
options:
  config_file: "/config/mihomo_proxy/mihomo.yaml"
map:
  - config:rw  
schema:
  config_file: "str?"
